# NeuralML Terminal build configuration.
# Memory limits intentionally modest so the project also builds on
# low-memory machines (phone-hosted proot, CI runners with 2 GB RAM).
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.daemon=true

kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=false
android.nonTransitiveRClass=true
